name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build-test-audit:
    runs-on: windows-latest
    timeout-minutes: 35

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Verify .NET 8 SDK selection
        shell: pwsh
        run: |
          $sdkVersion = dotnet --version
          Write-Host "Selected .NET SDK: $sdkVersion"
          if ($LASTEXITCODE -ne 0 -or $sdkVersion -notmatch '^8\.0\.\d+$') {
            throw 'The build must use a stable .NET 8 SDK.'
          }

      - name: Restore
        run: dotnet restore .\Gtools.sln

      - name: Build Release
        run: dotnet build .\Gtools.sln -c Release --no-restore /warnaserror

      - name: Test Release
        run: dotnet test .\tests\Gtools.Tests\Gtools.Tests.csproj -c Release --no-build --logger "trx;LogFileName=release-tests.trx"

      - name: Scan NuGet dependencies for known vulnerabilities
        shell: pwsh
        run: |
          $solution = (Resolve-Path .\Gtools.sln).Path
          $scan = & dotnet list $solution package --vulnerable --include-transitive --format json 2>&1
          $exitCode = $LASTEXITCODE
          $scan | Write-Host
          if ($exitCode -ne 0) {
            throw "NuGet vulnerability scan failed with exit code $exitCode."
          }
          $scanText = $scan -join "`n"
          $null = $scanText | ConvertFrom-Json
          if ($scanText -match '(?i)"vulnerabilities"\s*:') {
            throw 'NuGet vulnerability scan found one or more advisories.'
          }

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: '**/release-tests.trx'
          if-no-files-found: ignore
          retention-days: 7
